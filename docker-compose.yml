services:
  postgres:
    image: postgres:16-alpine
    container_name: kafmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kafmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kafmind_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kafmind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kafmind_user} -d ${POSTGRES_DB:-kafmind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kafmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kafmind-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  kafka:
    image: apache/kafka:latest
    container_name: kafmind-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9094,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kafmind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kafmind_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kafmind_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kafmind_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kafmind_user}:${POSTGRES_PASSWORD:-kafmind_pass}@postgres:5432/${POSTGRES_DB:-kafmind_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TOKEN_HARBOR_API_KEY=${TOKEN_HARBOR_API_KEY}
      - TOKEN_HARBOR_BASE_URL=${TOKEN_HARBOR_BASE_URL:-https://tokenharbor.ai/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-v4.1-flash:free}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:3000"]
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      qdrant:
        condition: service_started
    command: ["server"]

  ingestion-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kafmind-ingestion-worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-kafmind_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kafmind_pass}
      - POSTGRES_DB=${POSTGRES_DB:-kafmind_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kafmind_user}:${POSTGRES_PASSWORD:-kafmind_pass}@postgres:5432/${POSTGRES_DB:-kafmind_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - TOKEN_HARBOR_API_KEY=${TOKEN_HARBOR_API_KEY}
      - TOKEN_HARBOR_BASE_URL=${TOKEN_HARBOR_BASE_URL:-https://tokenharbor.ai/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-v4.1-flash:free}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["worker"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
    container_name: kafmind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  kafka_data:
  uploads_data:
